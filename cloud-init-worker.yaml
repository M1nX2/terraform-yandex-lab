#cloud-config
package_update: true
packages:
  - python3
write_files:
  - path: /usr/local/bin/worker.sh
    permissions: "0755"
    content: |
      #!/bin/bash
      while true; do
        python3 -c 'from datetime import datetime; print(f"Task {datetime.now().isoformat()}")' >> /var/log/worker.log
        sleep 60
      done
  - path: /etc/systemd/system/worker.service
    permissions: "0644"
    content: |
      [Unit]
      Description=Educational background worker
      After=network.target

      [Service]
      Type=simple
      ExecStart=/usr/local/bin/worker.sh
      Restart=always
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
runcmd:
  - systemctl daemon-reload
  - systemctl enable --now worker.service
